name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser build is tied to the Playwright version, which package.json
      # pins exactly, so the cache key can be that version alone.
      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium build
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cached browser still needs its system libraries on a fresh runner.
      - name: Install Chromium system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Fails with the command to run if an inline script changed without
      # regenerating the hashes, before anything slower gets a chance to.
      - name: Check the CSP hashes are current
        run: node tools/csp-hashes.mjs --check

      - name: Validate the markup
        run: npm run lint:html

      # Imports a ZIP, exports it, reopens it, and asserts that nothing left
      # the origin and that 50,000 messages still render in under two seconds.
      - name: Run the browser checks
        run: node tests/verify.mjs

  # Publishes to GitHub Pages only after the checks above pass, and only from main.
  # Requires Settings -> Pages -> Source: "GitHub Actions" (configure-pages tries to
  # set that itself, but the repository owner may still have to select it once).
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Only the viewer is published. Tests, tooling and the server configs stay in
      # the repository rather than being served to visitors.
      - name: Assemble the published site
        run: |
          mkdir -p site
          cp index.html site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
