 const rows=scrollArea.querySelectorAll('[data-chat-date]');
 for(const row of rows)if(row.getBoundingClientRect().bottom>edge)return row.dataset.chatDate;
 return rows.length?rows[rows.length-1].dataset.chatDate:'';
}
function updateScrollControls(showDate=false){
 const hasMessages=!!state?.messages?.length;
 $('chatNavigation').hidden=!hasMessages;
 scrollFirst.disabled=!hasMessages||(start===0&&scrollArea.scrollTop<=2);
 scrollLast.disabled=!hasMessages||(start+pageSize>=state.messages.length&&scrollArea.scrollTop+scrollArea.clientHeight>=scrollArea.scrollHeight-2);
 if(!hasMessages){scrollDate.classList.remove('visible');return}
 if(showDate){const date=visibleConversationDate();scrollDate.textContent=date?date.replaceAll('-','. '):'날짜 확인 필요';scrollDate.classList.add('visible');clearTimeout(dateFadeTimer);dateFadeTimer=setTimeout(()=>scrollDate.classList.remove('visible'),1100);}
}
scrollArea.addEventListener('scroll',()=>{if(scrollFrame)cancelAnimationFrame(scrollFrame);scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;updateScrollControls(true)})},{passive:true});
function moveConversationEdge(last){
 if(!state?.messages?.length)return;
 start=last?Math.floor((state.messages.length-1)/pageSize)*pageSize:0;
 renderMessages();
 requestAnimationFrame(()=>{const behavior=scrollArea.style.scrollBehavior;scrollArea.style.scrollBehavior='auto';scrollArea.scrollTop=last?scrollArea.scrollHeight:0;scrollArea.style.scrollBehavior=behavior;updateScrollControls(true)});
}
scrollFirst.onclick=()=>moveConversationEdge(false);scrollLast.onclick=()=>moveConversationEdge(true);
new MutationObserver(()=>requestAnimationFrame(()=>updateScrollControls(false))).observe(scrollArea,{childList:true});
window.addEventListener('resize',()=>updateScrollControls(false));scrollArea.addEventListener('load',()=>updateScrollControls(false),true);updateScrollControls(false);
</script><script>initAttachmentPicker();</script><script>function setConversationTools(open,restoreFocus=false){
 const panel=$('details');panel.classList.toggle('open',open);panel.inert=!open;positionDetailsPanel();
 if(!open&&restoreFocus)$('infoToggle').focus({preventScroll:true});
}
$('infoToggle').onclick=()=>setConversationTools(!$('details').classList.contains('open'));
$('panelClose').onclick=()=>setConversationTools(false,true);
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape'||e.isComposing||e.defaultPrevented)return;
 // Native dialogs handle Escape themselves; never close the panel underneath.

let conversationPointer=null;

 conversationPointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,scrollTop:$('messages').scrollTop};
},{passive:true});
document.addEventListener('pointermove',e=>{const p=conversationPointer;if(p&&p.id===e.pointerId&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>5)p.moved=true},{passive:true});
document.addEventListener('pointercancel',()=>{conversationPointer=null},{passive:true});
conversationSurface.addEventListener('click',e=>{
 const p=conversationPointer;conversationPointer=null;
 if(!$('details').classList.contains('open')||document.querySelector('dialog[open]'))return;
 if(e.detail>0&&(!p||p.moved||Math.abs($('messages').scrollTop-p.scrollTop)>2))return;
 const selection=window.getSelection();if(selection&&!selection.isCollapsed&&selection.toString().length)return;

// Persist the preferred width; temporarily constrain it when the window is smaller.
const sidebarApp=document.querySelector('.app'),sidebarHandle=$('sidebarResize');
const sidebarWidthKey='conversation-drawer-sidebar-width';
let preferredSidebarWidth=null,sidebarDrag=null;
try{const saved=Number(localStorage.getItem(sidebarWidthKey));if(Number.isFinite(saved)&&saved>=190)preferredSidebarWidth=saved}catch{}
function sidebarLimits(){return {min:190,max:Math.max(190,Math.min(420,sidebarApp.clientWidth-360))}}
function applySidebarWidth(){
 const limits=sidebarLimits();const defaultWidth=window.innerWidth<=1100?215:250;
 const width=Math.round(Math.max(limits.min,Math.min(limits.max,preferredSidebarWidth??defaultWidth)));
 sidebarApp.style.setProperty('--sidebar-width',width+'px');
 sidebarHandle.setAttribute('aria-valuemin',limits.min);sidebarHandle.setAttribute('aria-valuemax',limits.max);sidebarHandle.setAttribute('aria-valuenow',width);sidebarHandle.setAttribute('aria-valuetext',width+'픽셀');
 if(typeof positionDetailsPanel==='function')positionDetailsPanel();
 return width;
}
function saveSidebarWidth(){try{if(preferredSidebarWidth===null)localStorage.removeItem(sidebarWidthKey);else localStorage.setItem(sidebarWidthKey,String(preferredSidebarWidth))}catch{}}
function setSidebarWidth(width){const limits=sidebarLimits();preferredSidebarWidth=Math.max(limits.min,Math.min(limits.max,width));applySidebarWidth()}
sidebarHandle.addEventListener('pointerdown',e=>{
 if(e.button!==0||window.innerWidth<=650)return;
 e.preventDefault();sidebarDrag={id:e.pointerId,x:e.clientX,width:applySidebarWidth()};
 sidebarHandle.setPointerCapture(e.pointerId);sidebarHandle.focus({preventScroll:true});document.body.classList.add('sidebar-dragging');
});
sidebarHandle.addEventListener('pointermove',e=>{if(sidebarDrag?.id===e.pointerId)setSidebarWidth(sidebarDrag.width+e.clientX-sidebarDrag.x)});
function finishSidebarDrag(e){if(sidebarDrag?.id!==e.pointerId)return;sidebarDrag=null;document.body.classList.remove('sidebar-dragging');if(sidebarHandle.hasPointerCapture(e.pointerId))sidebarHandle.releasePointerCapture(e.pointerId);saveSidebarWidth()}
sidebarHandle.addEventListener('pointerup',finishSidebarDrag);sidebarHandle.addEventListener('pointercancel',finishSidebarDrag);sidebarHandle.addEventListener('lostpointercapture',finishSidebarDrag);
sidebarHandle.addEventListener('dblclick',()=>{preferredSidebarWidth=null;applySidebarWidth();saveSidebarWidth()});
sidebarHandle.addEventListener('keydown',e=>{
 const width=applySidebarWidth(),step=e.shiftKey?30:10,limits=sidebarLimits();
 if(e.key==='ArrowLeft')setSidebarWidth(width-step);else if(e.key==='ArrowRight')setSidebarWidth(width+step);else if(e.key==='Home')setSidebarWidth(limits.min);else if(e.key==='End')setSidebarWidth(limits.max);else return;
 e.preventDefault();saveSidebarWidth();
});
window.addEventListener('resize',applySidebarWidth);applySidebarWidth();
</script><script>
let videoViewerSource=null,videoViewerWasPlaying=false,videoViewerUrl=null;
function openVideoViewer(source,name){
 const player=$('largeVideo');videoViewerSource=source;videoViewerWasPlaying=!source.paused&&!source.ended;
 const position=source.currentTime;source.pause();
 player.onloadedmetadata=()=>{try{player.currentTime=position}catch{}if(videoViewerWasPlaying)player.play().catch(()=>{})};
 if(videoViewerUrl){URL.revokeObjectURL(videoViewerUrl);videoViewerUrl=null}
 if(source.sourceFile)videoViewerUrl=URL.createObjectURL(source.sourceFile);
 player.src=videoViewerUrl||source.currentSrc||source.src;player.volume=source.volume;player.muted=source.muted;player.playbackRate=source.playbackRate;
 $('videoViewerTitle').textContent='크게 보기';$('videoViewer').showModal();player.load();
}
$('closeVideoViewer').onclick=()=>$('videoViewer').close();
$('videoViewer').addEventListener('close',()=>{
 const player=$('largeVideo'),source=videoViewerSource;const resume=!player.paused&&!player.ended;
 player.pause();if(source&&source.isConnected){try{source.currentTime=player.currentTime;source.volume=player.volume;source.muted=player.muted;source.playbackRate=player.playbackRate}catch{}if(resume)source.play().catch(()=>{})}
 player.onloadedmetadata=null;player.removeAttribute('src');player.load();if(videoViewerUrl){URL.revokeObjectURL(videoViewerUrl);videoViewerUrl=null}videoViewerSource=null;videoViewerWasPlaying=false;
});
</script></body></html>
