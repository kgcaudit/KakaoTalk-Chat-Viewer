# Static hosting for index.html. Nothing here accepts a request body:
# chat files are read by the browser's File API and never reach this server.
server {
    listen 443 ssl http2;
    server_name chat.example.com;

    root /srv/kakaotalk-chat-viewer;
    index index.html;

    # A viewer that cannot receive uploads cannot retain them.
    client_max_body_size 0;
    limit_except GET HEAD { deny all; }

    # frame-ancestors and the rest cannot be set from a <meta> tag.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_types text/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
